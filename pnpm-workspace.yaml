packages:
  - apps/*
  - packages/*
  - tools/*

catalog:
  "@dnd-kit/core": ^6.3.1
  "@dnd-kit/modifiers": ^9.0.0
  "@dnd-kit/sortable": ^10.0.0
  "@dnd-kit/utilities": ^3.2.2
  "@fastify/cors": ^10.1.0
  "@fastify/multipart": ^9.0.3
  "@lexical/clipboard": ^0.45.0
  "@lexical/code": ^0.45.0
  "@lexical/extension": ^0.45.0
  "@lexical/headless": ^0.45.0
  "@lexical/html": ^0.45.0
  "@lexical/link": ^0.45.0
  "@lexical/list": ^0.45.0
  "@lexical/markdown": ^0.45.0
  "@lexical/react": ^0.45.0
  "@lexical/rich-text": ^0.45.0
  "@lexical/selection": ^0.45.0
  "@lexical/utils": ^0.45.0
  "@mikro-orm/core": ^7.0.11
  "@mikro-orm/decorators": ^7.0.11
  "@mikro-orm/migrations": ^7.0.11
  "@mikro-orm/sqlite": ^7.0.11
  "@playwright/cli": ^0.1.8
  "@sindresorhus/slugify": ^2.2.1
  "@tailwindcss/typography": ^0.5.16
  "@tanstack/react-query": ^5.99.0
  "@trpc/client": ^11.16.0
  "@trpc/server": ^11.16.0
  "@trpc/tanstack-react-query": ^11.16.0
  "@types/node": ^24
  agent-browser: ^0.26.0
  clsx: ^2.1.1
  cookie: ^1.1.1
  fastify: ^5.8.5
  image-meta: ^0.2.2
  ipaddr.js: ^2.4.0
  jszip: ^3.10.1
  lexical: ^0.45.0
  nanoid: ^5.0.7
  playwright-cli: ^0.262.0
  remixicon: ^4.9.1
  superjson: ^2.2.2
  "tailwind-merge": ^3.3.0
  typescript: ^5
  # Pinned to one coherent set: the 0.2.x line dropped the bundled vite-plus-test
  # runner (switched to upstream vitest), and vite-plus-test is only published up
  # to 0.1.24. Floating `latest` let workspaces drift onto a 0.2.x core with no
  # matching runner, breaking `vp test`. Keep all three locked together.
  vite: npm:@voidzero-dev/vite-plus-core@0.1.24
  vite-plus: 0.1.24
  vitest: npm:@voidzero-dev/vite-plus-test@0.1.24
  yaml: ^2.8.3
  zod: ^4.3.6
  zod-form-data: ^3.0.2

catalogMode: prefer
# Don't install package releases until they're at least 2 weeks old (in minutes).
minimumReleaseAge: 20160
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
