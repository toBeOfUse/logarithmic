packages:
  - apps/*
  - packages/*
  - tools/*

catalog:
  "@mikro-orm/core": ^7.0.11
  "@mikro-orm/decorators": ^7.0.11
  "@mikro-orm/migrations": ^7.0.11
  "@mikro-orm/sqlite": ^7.0.11
  '@playwright/cli': ^0.1.8
  "@tanstack/react-query": ^5.99.0
  '@tiptap/core': ^3.22.3
  '@tiptap/react': ^3.22.3
  '@tiptap/starter-kit': ^3.22.3
  "@trpc/client": ^11.16.0
  "@trpc/server": ^11.16.0
  "@trpc/tanstack-react-query": ^11.16.0
  "@types/node": ^24
  agent-browser: ^0.26.0
  fastify: ^5.8.5
  playwright-cli: ^0.262.0
  remixicon: ^4.9.1
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  zod: ^4.3.6

catalogMode: prefer
overrides:
