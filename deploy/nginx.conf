# nginx front for the SPA: serves the static client build and reverse-proxies
# the API surface (tRPC procedures + /api/images/...) to the Fastify backend.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploaded images are capped at 10 MB by the backend, and the multipart body
    # runs a little over that (framing + text fields). Allow headroom so nginx
    # doesn't 413 a valid upload before it reaches the app.
    client_max_body_size 20m;

    # API + image bytes go to the backend. Anchored to `/api/` (not the bare
    # `/api` prefix) so an SPA route whose first segment merely starts with "api"
    # stays a client route — mirrors the app's own dev proxy rule.
    location ^~ /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fingerprinted build assets are immutable under a given name — cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: any other path is a client route → hand back index.html.
    location / {
        try_files $uri /index.html;
    }
}
